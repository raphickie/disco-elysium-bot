name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Validate deployment scripts
        run: |
          node --check scripts/ensure-workers-subdomain.mjs
          node --check scripts/set-webhook.mjs

  deploy:
    name: Migrate D1 and deploy Worker
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: disco-elysium-cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=Missing Cloudflare credentials::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Repository secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:remote

      # Account initialization only: if workers.dev is not registered,
      # set up a sensible account-wide subdomain without a browser prompt.
      - name: Ensure workers.dev subdomain
        id: worker_subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-workers-subdomain.mjs

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Sync webhook secret into Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [[ -z "$TELEGRAM_WEBHOOK_SECRET" ]]; then
            echo "::error title=Webhook secret missing::Set TELEGRAM_WEBHOOK_SECRET in GitHub Repository Secrets."
            exit 1
          fi
          if [[ ! "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{1,256}$ ]]; then
            echo "::error title=Invalid webhook secret::Use letters, digits, underscores or hyphens (1-256 characters)."
            exit 1
          fi
          printf %s "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET

      - name: Sync bot token into Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" ]]; then
            echo "::error title=Telegram bot token missing::Set TELEGRAM_BOT_TOKEN in GitHub Repository Secrets."
            exit 1
          fi
          printf %s "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Register webhook with Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WORKER_URL: https://disco-elysium-bot.${{ steps.worker_subdomain.outputs.subdomain }}.workers.dev
        run: node scripts/set-webhook.mjs

      - name: Deployment summary
        run: |
          echo "### Deployment and Telegram webhook registration complete" >> "$GITHUB_STEP_SUMMARY"
          echo "D1 migrations, Worker deployment, Telegram secrets sync and Telegram webhook registration succeeded." >> "$GITHUB_STEP_SUMMARY"
